services:
  mongo:
    image: mongo:7.0
    container_name: disney-cruise-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cruise_search
    volumes:
      - mongo-data:/data/db
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: disney-cruise-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"

volumes:
  mongo-data:
