services:
  mongo:
    image: mongo:7.0
    container_name: disney-cruise-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cruise_search
    volumes:
      - mongo-data:/data/db
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: disney-cruise-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: disney-cruise-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - mongo
      - redpanda
  grafana:
    image: grafana/grafana:11.2.0
    container_name: disney-cruise-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongo-data:
  grafana-data:
