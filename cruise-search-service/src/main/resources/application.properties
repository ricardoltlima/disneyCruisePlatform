spring.application.name=cruise-search-service
server.port=8081
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${MONGODB_DATABASE:cruise_search}
spring.data.mongodb.auto-index-creation=true
app.security.jwt.secret=${JWT_SECRET:local-dev-cruise-search-jwt-secret-please-change}
management.endpoints.web.exposure.include=health,info,metrics
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]
