global:
  scrape_interval: 15s

scrape_configs:
  - job_name: cruise-search-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081

  - job_name: reservation-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8085

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8083
